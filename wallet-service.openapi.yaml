openapi: 3.0.3
info:
  title: Wallet Service
  version: 1.0.0
  description: |
    Holds a per-user balance in whole currency units (IDR, no decimals).
    All balance-changing operations require an `Idempotency-Key` header.
    Replaying the same key with the same payload returns the original response;
    replaying it with a different payload returns 422 IDEMPOTENCY_MISMATCH.
servers:
  - url: http://127.0.0.1:8081
paths:
  /wallets:
    post:
      summary: Create a wallet with zero balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                currency: { type: string, default: IDR }
      responses:
        "201":
          description: Wallet created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /wallets/{walletId}:
    get:
      summary: Get wallet balance and version
      parameters: [{ $ref: "#/components/parameters/WalletId" }]
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wallets/{walletId}/credit:
    post:
      summary: Add funds
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/Money" }
      responses:
        "200":
          description: Balance updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceChange" }
        "400": { $ref: "#/components/responses/MissingKey" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: INVALID_AMOUNT (amount <= 0) or IDEMPOTENCY_MISMATCH
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /wallets/{walletId}/debit:
    post:
      summary: Remove funds. Fails if balance would go negative.
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/Money" }
      responses:
        "200":
          description: Balance updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceChange" }
        "400": { $ref: "#/components/responses/MissingKey" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: INSUFFICIENT_FUNDS — balance is unchanged. Error includes `balance` and `requested`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: INVALID_AMOUNT or IDEMPOTENCY_MISMATCH
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /wallets/{walletId}/transactions:
    get:
      summary: Ledger of all credits and debits, oldest first
      parameters: [{ $ref: "#/components/parameters/WalletId" }]
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletId: { type: string }
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/reset:
    post:
      summary: Test-only. Deletes all wallets and idempotency records.
      responses:
        "204": { description: Reset }
components:
  parameters:
    WalletId:
      name: walletId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  requestBodies:
    Money:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount: { type: integer, minimum: 1 }
              reference: { type: string, nullable: true, description: Free-text link to the originating action, e.g. "claim:<claimId>" }
  responses:
    NotFound:
      description: WALLET_NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MissingKey:
      description: IDEMPOTENCY_KEY_REQUIRED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Wallet:
      type: object
      properties:
        walletId: { type: string, format: uuid }
        userId: { type: string }
        currency: { type: string }
        balance: { type: integer }
        version: { type: integer, description: Increments on every successful balance change }
    Transaction:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        type: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: integer }
        reference: { type: string, nullable: true }
        balanceAfter: { type: integer }
    BalanceChange:
      type: object
      properties:
        walletId: { type: string }
        balance: { type: integer }
        version: { type: integer }
        transaction: { $ref: "#/components/schemas/Transaction" }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: true
